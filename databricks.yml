bundle:
  name: nhanes_mlops

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-142fbca7-7bac.cloud.databricks.com

variables:
  catalog:
    default: workspace
  schema:
    default: nhanes_demo
  experiment:
    default: /Shared/nhanes_demo/dummy_experiment
  model_name:
    default: dummy_model_ci

resources:
  jobs:
    hello_job: # Dummy test job
      name: hello_job
      tasks:
        - task_key: hello
          spark_python_task:
            python_file: ./src/hello_world.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"                # serverless environment version
    
    lifecycle_job: # Training job
      name: lifecycle_job
      tasks:
        - task_key: train
          spark_python_task:
            python_file: ./src/lifecycle_smoke_test.py
            parameters:
              - "--catalog=${var.catalog}"
              - "--schema=${var.schema}"
              - "--experiment=${var.experiment}"
              - "--model=${var.model_name}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - mlflow==3.17.0
              - scikit-learn==1.9.1

    rollback_job: 
      name: rollback_job
      tasks:
        - task_key: rollback
          spark_python_task:
            python_file: ./src/rollback_test.py
            parameters:
              - "--catalog=${var.catalog}"
              - "--schema=${var.schema}"
              - "--model=${var.model_name}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - mlflow==3.17.0
              - scikit-learn==1.9.1
            